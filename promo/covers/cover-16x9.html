<!doctype html>
<html lang="zh-CN" data-om-signature="off">
<head>
<meta charset="utf-8">
<title>CITY Social Map — 16:9 &amp; 4:3 巨字爆裂主封面</title>
<style>
  @font-face { font-family: "M PLUS Rounded 1c"; src: url("../assets/fonts/MPlusRounded1c-800.ttf") format("truetype"); font-weight: 800; font-style: normal; }
  @font-face { font-family: "M PLUS Rounded 1c"; src: url("../assets/fonts/MPlusRounded1c-900.ttf") format("truetype"); font-weight: 900; font-style: normal; }
  @font-face { font-family: "Noto Sans SC"; src: url("../assets/fonts/NotoSansSC-900.woff") format("woff"); font-weight: 900; font-style: normal; }
  @font-face { font-family: "Poppins"; src: url("../assets/fonts/Poppins-800.woff") format("woff"); font-weight: 800; font-style: normal; }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #141419;
    color: #141419;
    font-family: "M PLUS Rounded 1c", "Noto Sans SC", "Poppins", sans-serif;
  }

  #film {
    position: relative;
    width: 1920px;
    height: 1080px;
    padding: 14px;
    background: #141419;
    overflow: hidden;
  }

  /* 4-Color C-I-T-Y Comic Backdrop with Vertical Center Gutter at x=960 */
  .manga-grid {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 14px;
  }
  .cell {
    position: relative;
    border-radius: 26px;
    border: 6px solid #141419;
    overflow: hidden;
  }
  .c-gold { background: #F7B647; }
  .c-pink { background: #F09CB4; }
  .c-green { background: #99CB77; }
  .c-coral { background: #EE847D; }
  .halftone {
    position: absolute;
    inset: 0;
    opacity: 0.16;
    background-image: radial-gradient(#141419 2.2px, transparent 2.2px);
    background-size: 16px 16px;
    pointer-events: none;
  }
  .sunburst {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-conic-gradient(from 0deg at 50% 42%, rgba(255,253,249,0.16) 0deg 10deg, rgba(255,253,249,0) 10deg 20deg);
    z-index: 2;
  }

  /* Top Brand Capsule strictly centered at x=960 inside 4:3 safe frame */
  .top-pill-wrap {
    position: absolute;
    left: 50%;
    top: 28px;
    transform: translateX(-50%);
    z-index: 30;
  }
  .top-pill {
    display: flex;
    align-items: center;
    gap: 20px;
    background: #FFFDF9;
    border: 6px solid #141419;
    box-shadow: 9px 9px 0 #141419;
    border-radius: 999px;
    padding: 8px 34px;
    white-space: nowrap;
  }
  .top-pill-title {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: #141419;
  }

  /* Character Sticker Nodes */
  .char-chip {
    position: absolute;
    transform: translate(-50%, -50%);
    z-index: 16;
  }
  .char-ring {
    border-radius: 999px;
    border: 7px solid #141419;
    box-shadow: 10px 10px 0 #141419;
    background: #FFFDF9;
    padding: 5px;
  }
  .char-ring img {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 999px;
    object-fit: cover;
    filter: contrast(1.05) saturate(1.06);
  }

  /* Large Expressive Gag Stamps (>=42px) */
  .gag-stamp {
    position: absolute;
    transform: translate(-50%, -50%);
    z-index: 22;
    border-radius: 999px;
    border: 5px solid #141419;
    box-shadow: 7px 7px 0 #141419;
    padding: 7px 24px;
    font-size: 44px;
    line-height: 1.05;
    font-weight: 900;
    white-space: nowrap;
  }

  /* Giant Full-Span Lower Poster Typography Zone (centered inside x: 275..1645, clearing bottom-right 00:29 corner) */
  .hero-headline-svg {
    position: absolute;
    left: 280px;
    top: 530px;
    width: 1360px;
    height: 245px;
    z-index: 28;
    overflow: visible;
    pointer-events: none;
  }

  .sub-banner-wrap {
    position: absolute;
    left: 870px;
    top: 778px;
    transform: translateX(-50%) rotate(-1.8deg);
    z-index: 30;
  }
  .sub-banner {
    background: #F7B647;
    border: 8px solid #141419;
    box-shadow: 14px 14px 0 #141419;
    border-radius: 34px;
    padding: 10px 46px;
    font-size: 124px;
    line-height: 1.08;
    font-weight: 900;
    color: #141419;
    white-space: nowrap;
    letter-spacing: -2px;
  }
  .sub-banner em {
    font-style: normal;
    color: #C22119;
    text-shadow: 5px 5px 0 #FFFDF9;
  }
</style>
</head>
